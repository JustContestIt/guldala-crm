# Local Postgres for development and tests. Port 5433: 5432 is often taken by other projects.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guldala
      POSTGRES_PASSWORD: guldala
      POSTGRES_DB: guldala
      TZ: Asia/Almaty
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guldala"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
